url: https://tomwenseleers.github.io/GCMSprime/
title: GCMSprime
repo:
  url:
    home: https://github.com/tomwenseleers/GCMSprime/
    source: https://github.com/tomwenseleers/GCMSprime/blob/master/GCMSprime/
    issue: https://github.com/tomwenseleers/GCMSprime/issues
    user: https://github.com/
destination: ../docs
template:
  bootstrap: 5
  theme: github-dark
  math-rendering: katex
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "GCMSprime hex logo showing resolved chromatographic peaks and their mass spectra"
  bslib:
    bg: "#fcfdfd"
    fg: "#203047"
    primary: "#087e83"
    base_font: "system-ui"
    heading_font: "system-ui"
    code_font: "system-ui"
    border-radius: 0.6rem
    navbar-bg: "#081629"
navbar:
  bg: dark
  type: dark
  structure:
    left: [intro, tutorials, algorithm, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/gcms-deconvolution.html
    tutorials:
      text: Tutorials
      menu:
        - text: GC/MS deconvolution for single samples
          href: articles/gcms-deconvolution.html
        - text: GC/MS deconvolution for multiple samples
          href: articles/multisample.html
        - text: Spectral library import
          href: articles/spectral-libraries.html
        - text: Retention indices and library search
          href: articles/library-search.html
        - text: Comparison with other software
          href: articles/software-comparison.html
    algorithm:
      text: Algorithm & theory
      menu:
        - text: "GC/MS deconvolution: mathematical basis"
          href: articles/algorithm.html
        - text: Retention indices and spectral identification
          href: articles/identification-theory.html
    github:
      icon: fab fa-github
      href: https://github.com/tomwenseleers/GCMSprime
home:
  strip_header: false
  title: "GCMSprime: Scalable and Automated GC–MS Deconvolution, Quantification, and Spectral Library Search in R"
  sidebar:
    structure: [links, citation, authors, license]
authors:
  sidebar:
    roles: [aut, cre, ctb]

articles:
  - title: Tutorials
    contents: [articles/gcms-deconvolution, articles/multisample, articles/spectral-libraries, articles/library-search]
  - title: Software comparison
    contents: [articles/software-comparison]
  - title: Algorithm and theory
    contents: [articles/algorithm, articles/identification-theory]
reference:
  - title: Deconvolution, quantification and reports
    contents: [gcmsDeco, GCMSbatch, plot.GCMSdeco, writeGCMSCDF]
  - title: Import and inspect spectral libraries
    contents: [readMSP, readGCMSID, libraryMetadata, spectra, retentionIndices]
  - title: Calibrate retention indices and identify compounds
    contents: [calibrateRI, annotateRI, librarySearch, libraryIonWeights, identifyCompounds]
  - title: Shared tools and package overview
    contents: [reexports, GCMSprime-package]
