url: https://tomwenseleers.github.io/GCMSprime/
title: GCMSprime
repo:
  url:
    home: https://github.com/tomwenseleers/GCMSprime/
    source: https://github.com/tomwenseleers/GCMSprime/blob/master/GCMSprime/
    issue: https://github.com/tomwenseleers/GCMSprime/issues
    user: https://github.com/
destination: ../docs
template:
  bootstrap: 5
  theme: github-dark
  math-rendering: katex
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "GCMSprime hex logo showing resolved chromatographic peaks and their mass spectra"
  bslib:
    bg: "#fcfdfd"
    fg: "#203047"
    primary: "#087e83"
    base_font: "system-ui"
    heading_font: "system-ui"
    code_font: "system-ui"
    border-radius: 0.6rem
    navbar-bg: "#081629"
navbar:
  bg: dark
  type: dark
  structure:
    left: [intro, tutorials, algorithm, reference, news]
    right: [search, github]
  components:
    tutorials:
      text: Tutorials
      menu:
        - text: GC/MS deconvolution
          href: articles/gcms-deconvolution.html
        - text: Spectral libraries and storage
          href: articles/spectral-libraries.html
        - text: Retention indices and library search
          href: articles/library-search.html
    intro:
      text: Get started
      href: articles/gcms-deconvolution.html
    algorithm:
      text: Algorithm & theory
      href: https://tomwenseleers.github.io/L0nmf/articles/log-concave-nmf.html
    github:
      icon: fab fa-github
      href: https://github.com/tomwenseleers/GCMSprime
home:
  strip_header: false
  title: "State-of-the-art GC/MS deconvolution, quantification and library search."
  sidebar:
    structure: [links, authors, license]
authors:
  sidebar:
    roles: [aut, cre, ctb]
